spring.application.name=PPTMCPServer
server.port=8080

# Spring AI MCP Server Configuration
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=pptmcp-server
spring.ai.mcp.server.version=1.0.0

# Endpoint Path (accessible via HTTP at http://localhost:8080/mcp)
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Execution Mode: SYNC handles synchronous @McpTool, @McpResource, and @McpPrompt methods
spring.ai.mcp.server.type=SYNC

# Enable declarative annotation scanning
spring.ai.mcp.server.annotation-scanner.enabled=true

# ==========================================
# Logging Configuration (File & Console)
# ==========================================
# Generates log files in the 'logs/' directory
logging.file.name=logs/pptmcp-server.log

# Log Levels
logging.level.root=INFO
logging.level.org.spring.microservices.pptmcpserver=DEBUG
logging.level.org.springframework.ai.mcp=INFO
logging.level.org.apache.poi=WARN

# Log Rolling Policy
logging.logback.rollingpolicy.file-name-pattern=logs/pptmcp-server-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Custom Log Formatting
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%blue(%t)] %cyan(%logger{36}) : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} : %msg%n